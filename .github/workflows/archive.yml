name: 📦 Repository History & Media Archive

on:
  workflow_dispatch:
    inputs:
      target_repository:
        description: '目标仓库全名 (格式: owner/repo)'
        required: true
        type: string
        default: 'attogram/THE-ERROR-IS-THE-MESSAGE'
      commit_to_branch:
        description: '是否直接将归档数据提交回仓库 archive 分支 (Direct Repo Dump)'
        required: true
        type: boolean
        default: true
      include_media:
        description: '是否抓取嵌入的多媒体与附件 (图片/音频/视频/PDF/Assets)'
        required: true
        type: boolean
        default: true

permissions:
  contents: write
  issues: read
  pull-requests: read

jobs:
  archive:
    name: 🗄️ Dump Repository, Releases & Media
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🧪 Run Automated Unit Tests
        run: |
          python -m unittest discover tests

      - name: 🚀 Execute Repository Dump
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TARGET_REPO="${{ github.event.inputs.target_repository || 'attogram/THE-ERROR-IS-THE-MESSAGE' }}"
          echo "Dumping repository: $TARGET_REPO"
          python tools/repo_dump.py "$TARGET_REPO" "dump"

      - name: 📊 Generate Action Summary
        run: |
          if [ -f "dump/SUMMARY.md" ]; then
            cat dump/SUMMARY.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: 📤 Upload Archive Artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-complete-archive-${{ github.run_id }}
          path: dump/
          retention-days: 30

      - name: 💾 Direct Repo Dump (Commit & Push to archive branch)
        if: ${{ github.event.inputs.commit_to_branch != 'false' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 切换或创建干净的 archive 归档分支
          git checkout -B archive
          git add -f dump/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(archive): auto-dump repository history, releases and media [skip ci]"
            git push -f origin archive || echo "Warning: Push to branch failed, artifact is safely retained."
          fi
